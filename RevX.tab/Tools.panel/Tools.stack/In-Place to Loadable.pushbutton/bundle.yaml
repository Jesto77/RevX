title: "In-Place to Loadable"
author: "Jesto Joy"
tooltip: |
  Converts an in-place family instance into a loadable `.rfa` family preserving category, placement, and geometry.
  
  How to Use:
  • Select an in-place family instance.
  • Run "In-Place to Loadable".
  • Choose whether to keep/delete original; builds `.rfa`, loads into project, and replaces instance.
