title: "Align Edges"
author: "Jesto Joy"
context: doc-project
min_revit_version: 2023
tooltip: |
  Regrade slab edges to match elevations of adjacent walls, curbs, or stairs.

  How to Use:
  • Pick slab element to modify.
  • Select alignment method (Slabs / Walls / Curbs / Stairs).
  • Select target adjacent elements.
  • Slab vertices are re-graded to match edge elevations.
