title: "Align Edges"
author: "Jesto Joy"
tooltip: |
  Regrades slab sub-elements to align edge elevations with adjacent walls, curbs, or stairs.
  
  How to Use:
  • Pick slab element to regrade.
  • Select alignment method (Slabs / Walls / Curbs / Stairs).
  • Pick adjacent target elements to snap edge elevations.
