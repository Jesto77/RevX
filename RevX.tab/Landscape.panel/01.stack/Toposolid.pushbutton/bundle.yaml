title: Organic Mound
tooltip: >
  Creates an organic terrain mound (Toposolid / TopographySurface)
  from selected boundary model lines with smooth natural grading.

author: Jesto Joy

description: |
  This tool generates a smooth, organic terrain mound inside a closed
  boundary using selected model lines.

  - Two creation modes:
      1. Slope Mode (1:N slope control)
      2. Max Height Mode (user-defined height in mm)

