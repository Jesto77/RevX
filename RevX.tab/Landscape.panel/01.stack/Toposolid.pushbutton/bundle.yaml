title: "Organic Mound"
author: "Jesto Joy"
tooltip: |
  Creates a smooth organic terrain mound (Toposolid / Topography) from boundary model lines.
  
  How to Use:
  • Select closed model line boundary loops.
  • Run "Organic Mound".
  • Choose Slope Mode (1:N ratio) or Max Height Mode (mm height) to generate mound surface.
