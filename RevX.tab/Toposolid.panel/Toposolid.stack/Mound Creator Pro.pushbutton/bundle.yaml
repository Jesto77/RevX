title: "Mound Creator Pro"
author: "Jesto Joy"
tooltip: |
  Advanced mound creation and editing tool for Toposolids (Revit 2024-2027) & TopographySurfaces.
  
  How to Use:
  • Run "Mound Creator Pro".
  • Select profile type (Dome, Mesa, Cone, Ridge).
  • Input footprint curve or center point and set height/slope controls.
