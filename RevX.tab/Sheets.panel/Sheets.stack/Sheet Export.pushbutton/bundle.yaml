title: "Sheet Export"
author: "Jesto Joy"
highlight: new
tooltip: |
  Batch exports sheets and views to PDF, DWG, DGN, DWF, NWC, IFC, and images with custom naming rules.
  
  How to Use:
  • Select sheets and views.
  • Choose export format (PDF, DWG, IFC, NWC, etc.).
  • Apply file naming rules and export presets.
