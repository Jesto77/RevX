title: "Offset"
author: "Jesto Joy"
tooltip: |
  Resizes Floors, Ceilings, Roofs, and Toposolids with uniform boundary offsets (+ outward / - inward).
  
  How to Use:
  • Run "Offset".
  • Enter offset distance in mm (+ for outward expansion, - for inward shrink).
  • Select elements to resize; loops update consistently.
